      );
      overflow: hidden;

      will-change: transform, filter;
    }

    #bg-tv {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.88;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(210, 228, 238, 0.042) 0,
          rgba(210, 228, 238, 0.042) 1px,
          transparent 1px,
          transparent 3px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(200, 218, 228, 0.032) 0,
          rgba(200, 218, 228, 0.032) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.28) 0,
        rgba(0, 0, 0, 0.28) 1px,
        transparent 1px,
        transparent 3px
      );
      box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.72);
    }

    body.is-screen-glitching::before {
      opacity: 0.62;
    }

    body.is-screen-glitching::after {
      opacity: 0.34;
    }

    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: pre;
      border: 0;
    }

    .title-wrap {

      position: fixed;
      z-index: 2;
      left: 50%;
      width: 1100px;
      margin: 0;
      transform: translateX(-50%);
    }

    .title-wrap canvas {

      height: 260px;
      pointer-events: none;
    }

    .title-links {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .title-links a {
      position: absolute;
      z-index: 2;
      pointer-events: auto;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
    }

    .title-links .title-song-shield,

      z-index: 1;
      pointer-events: auto;
      cursor: default;
      background: transparent;
    }

    .vcr-dock {

      z-index: 3;
      left: 0.95rem;
      right: 0.95rem;
      bottom: 2.05rem;
      overflow: hidden;
    }

    .vcr-dock-inner {
      position: relative;
      z-index: 1;
      display: block;
    }

    .vcr-dock-inner .vcr-time,
    .vcr-dock-inner .vcr-date,
    .vcr-dock-inner .vcr-mute,
    .vcr-dock-inner .vcr-sludge,
    .vcr-dock-inner .vcr-brand {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
    }

    .vcr-dock-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: auto;
      pointer-events: none;
      z-index: 0;
    }


    .vcr-mute {
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .vcr-mute canvas,
    .vcr-brand canvas,
    .vcr-time canvas,
    .vcr-date canvas,
    .vcr-sludge canvas {

      height: 1px;

      padding: 0;

      border: 0;
    }

      outline: 1px solid rgba(255, 255, 255, 0.45);

      const offsets = [];
      let acc = 0;
      for (const mix of broadcastMixes) {
        offsets.push(acc);
        acc += mix.durationSec;
      }
      return offsets;
    })();
    const BROADCAST_SEQUENCE_DURATION_SEC = mixSequenceOffsets.length
      ? mixSequenceOffsets[mixSequenceOffsets.length - 1] + broadcastMixes[broadcastMixes.length - 1].durationSec

    let nowPlayingMixIndex = -1;

      if (!titleDisplayText) return;

    function screenGlitchIntervalMs() {

    function beginScreenGlitchBurst() {
      screenGlitchBurstActive = true;
      screenGlitchBurstStart = performance.now();
      screenGlitchBurstDuration = 30 + Math.random() * 60;

    function scheduleScreenGlitch() {
      clearScreenGlitchTimer();
      screenGlitchTimer = setTimeout(() => {
        beginScreenGlitchBurst();
        scheduleScreenGlitch();
      }, screenGlitchIntervalMs());
    }

    function screenGlitchStrength(now) {
      if (!screenGlitchBurstActive) return 0;
      const elapsed = now - screenGlitchBurstStart;
      if (elapsed >= screenGlitchBurstDuration) {
        screenGlitchBurstActive = false;
        return 0;
      }
      return 1;
    }

    function applyScreenGlitchVisual(now) {
      const strength = screenGlitchStrength(now);
      screenGlitchIntensity = strength;
      if (strength <= 0) {
        document.body.classList.remove("is-screen-glitching");
        document.body.style.filter = "";
        document.body.style.transform = "";
        return;
      }
      document.body.classList.add("is-screen-glitching");
      const shake = strength * 16;
      const dx = (Math.random() - 0.5) * shake;
      const dy = (Math.random() - 0.5) * shake * 0.7;
      const blur = strength * (1.6 + Math.random() * 3.2);
      const skew = (Math.random() - 0.5) * 2.8 * strength;
      const hue = (Math.random() - 0.5) * 14 * strength;
      const scaleX = 1 + (Math.random() - 0.5) * 0.035 * strength;
      document.body.style.filter =
        `blur(${blur}px) contrast(${1 + strength * 0.5}) brightness(${1 + strength * 0.06}) hue-rotate(${hue}deg)`;
      document.body.style.transform =
        `translate3d(${dx}px, ${dy}px, 0) skewX(${skew}deg) scaleX(${scaleX})`;
    }

    function screenGlitchSoft() {
      return screenGlitchIntensity < 0.12;
    }

    function screenGlitchLoop() {
      applyScreenGlitchVisual(performance.now());
      requestAnimationFrame(screenGlitchLoop);
    }

    function titleGlitchPhase(now) {
      if (!titleGlitchBurstActive || !titleDisplayText) return "normal";
      const elapsed = now - titleGlitchBurstStart;
      if (elapsed >= titleGlitchBurstDuration) {
        titleGlitchBurstActive = false;
        return "normal";
      }
      const r = elapsed / titleGlitchBurstDuration;
      if (r < 0.38) return "distort";
      if (r < 0.72) return "hidden";
      return "recover";

    function trackIndexAt(seconds, tracks) {
      for (let i = 0; i < tracks.length; i++) {
        if (seconds < tracks[i].endSec) return i;
      }
      return tracks.length - 1;

    function resolveBroadcastState(nowMs = Date.now()) {
      const elapsed = (nowMs - BROADCAST_START_MS) / 1000;
      if (elapsed < 0) return null;
      const seq = elapsed % BROADCAST_SEQUENCE_DURATION_SEC;
      for (let i = 0; i < broadcastMixes.length; i++) {
        const start = mixSequenceOffsets[i];
        const end = start + broadcastMixes[i].durationSec;
        if (seq < end) {
          return { mixIndex: i, positionSec: seq - start };
        }
      }
      return { mixIndex: 0, positionSec: 0 };
    }

    function standbyAudioSide() {
      return 1 - activeAudioSide;

      return audioSideEl(standbyAudioSide());

      return (mixIndex + 1) % broadcastMixes.length;

      return broadcastMixes[state.mixIndex].durationSec - state.positionSec;

    function mixMp3Url(mixIndex) {

      return decodeURIComponent(mixMp3Url(mixIndex).split("/").pop() || "");

      if (!el.src) return false;
      const token = mixSrcToken(mixIndex);

      if (!Number.isFinite(seekSec) || seekSec < 0) return false;
      if (seekSec <= 0.25 && el.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return true;
      const ranges = el.buffered;
      for (let i = 0; i < ranges.length; i++) {
        if (seekSec >= ranges.start(i) - 0.35 && seekSec <= ranges.end(i) + 0.5) return true;
      }
      return el.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA;
    }

    function isSlotPlayable(side, seekSec) {
      const el = audioSideEl(side);
      if (slotMixIndex[side] < 0) return false;
      if (el.readyState < HTMLMediaElement.HAVE_METADATA) return false;
      return isBufferedForSeek(el, seekSec);
    }

    function applySlotSeek(side, seekSec) {
      const el = audioSideEl(side);
      if (el.seeking) return;
      if (Math.abs(el.currentTime - seekSec) <= 0.05) return;
      try {
        el.currentTime = seekSec;
      } catch {
        /* ignore invalid seek while loading */
      }
    }

    function prepareAudioSide(side, mixIndex, positionSec) {
      const el = audioSideEl(side);
      const mix = broadcastMixes[mixIndex];
      slotSeekTarget[side] = positionSec;

      const already = slotMixIndex[side] === mixIndex && slotHasMixSrc(el, mixIndex);
      if (already && el.readyState >= HTMLMediaElement.HAVE_METADATA) {
        applySlotSeek(side, positionSec);
        return;
      }

      slotMixIndex[side] = mixIndex;
      slotPrepAttempts[side] = 0;
      el.preload = "auto";
      el.loop = false;
      el.src = mix.mp3;
      el.load();
    }

    function onSlotMediaReady(side) {
      const el = audioSideEl(side);
      const mixIndex = slotMixIndex[side];
      if (mixIndex < 0) return;
      applySlotSeek(side, slotSeekTarget[side]);
      const state = resolveBroadcastState();
      if (!state) return;

      const standby = standbyAudioSide();
      if (side === standby && mixIndex === nextMixIndex(state.mixIndex) && slotSeekTarget[side] === 0) {
        return;
      }
      if (side === activeAudioSide && mixIndex === state.mixIndex && el.paused && state) {
        /* filled by tryStartMutedPlayback / handoff */
      }
    }

    function wireAudioSlot(side) {
      const el = audioSideEl(side);
      const bump = () => onSlotMediaReady(side);
      el.addEventListener("loadedmetadata", bump);
      el.addEventListener("loadeddata", bump);
      el.addEventListener("canplay", bump);
      el.addEventListener("progress", () => {
        const state = resolveBroadcastState();
        if (!state) return;
        if (side === standbyAudioSide() && slotMixIndex[side] === nextMixIndex(state.mixIndex)) {
          applySlotSeek(side, slotSeekTarget[side]);
        }
      });
      el.addEventListener("error", () => {
        radioLog("error", "slot_media_error", slotReadinessDetail(side, slotSeekTarget[side]));
        if (slotPrepAttempts[side] >= BROADCAST_PREP_MAX_ATTEMPTS) return;
        slotPrepAttempts[side] += 1;
        const mixIndex = slotMixIndex[side];
        const seek = slotSeekTarget[side];
        if (mixIndex >= 0) {
          setTimeout(() => prepareAudioSide(side, mixIndex, seek), 800 * slotPrepAttempts[side]);
        }
      });
      el.addEventListener("ended", () => {
        recoverBroadcastFromClock(true);
      });
    }

    function clearHandoffRecovery() {
      if (handoffRecoveryTimer !== null) {
        clearInterval(handoffRecoveryTimer);
        handoffRecoveryTimer = null;
      }
      handoffRecoveryDeadlineMs = 0;
      handoffRecoveryAtBoundary = false;
    }

    function clearBroadcastSchedulers() {
      if (boundaryHandoffTimer !== null) {
        clearTimeout(boundaryHandoffTimer);
        boundaryHandoffTimer = null;
      }
      if (preloadLeadTimer !== null) {
        clearTimeout(preloadLeadTimer);
        preloadLeadTimer = null;
      }
    }

    function ensureStandbyPreparedForNextMix(state) {
      if (!state) return;
      const nextIdx = nextMixIndex(state.mixIndex);
      const standby = standbyAudioSide();
      if (slotMixIndex[standby] !== nextIdx) {
        prepareAudioSide(standby, nextIdx, 0);
      } else {
        applySlotSeek(standby, 0);
      }
    }

    function slotReadinessDetail(side, seekSec) {
      const el = audioSideEl(side);
      const buf = [];
      for (let i = 0; i < el.buffered.length; i++) {
        buf.push({ s: el.buffered.start(i), e: el.buffered.end(i) });
      }
      return {
        side,
        mixIndex: slotMixIndex[side],
        seekSec,
        readyState: el.readyState,
        paused: el.paused,
        currentTime: el.currentTime,
        buffered: buf,
        playable: isSlotPlayable(side, seekSec)
      };
    }

    function completeGaplessHandoff(handoffSide, needIdx, needPos, mode) {
      const incoming = audioSideEl(handoffSide);
      const outgoing = activeAudioEl();
      incoming.muted = audioMuted;
      applySlotSeek(handoffSide, needPos);

      const playPromise = incoming.play();
      if (playPromise) {
        playPromise.catch((err) => {
          radioLog("warn", "handoff_play_rejected", { mixIndex: needIdx, message: String(err) });
        });
      }
      outgoing.pause();

      activeAudioSide = handoffSide;
      bgm = activeAudioEl();
      lastDriftCorrectMs = Date.now();

      const upcoming = nextMixIndex(needIdx);
      prepareAudioSide(standbyAudioSide(), upcoming, 0);
      scheduleBoundaryHandoff();
      syncNowPlayingFromBroadcast();
      radioLog("info", "handoff_complete", { mode, mixIndex: needIdx, positionSec: needPos, activeSide: handoffSide });
      return true;
    }

    function scheduleStandbyHandoffRecovery(handoffSide, needIdx, needPos, atBoundary) {
      if (handoffRecoveryTimer !== null) return;
      handoffRecoveryAtBoundary = atBoundary;
      const waitMs = atBoundary ? BROADCAST_HANDOFF_BOUNDARY_WAIT_MS : BROADCAST_HANDOFF_RECOVERY_WAIT_MS;
      handoffRecoveryDeadlineMs = Date.now() + waitMs;
      radioLog("warn", "handoff_standby_not_ready", {
        ...slotReadinessDetail(handoffSide, needPos),
        needMixIndex: needIdx,
        atBoundary,
        waitMs
      });

      handoffRecoveryTimer = setInterval(() => {
        const state = resolveBroadcastState();
        if (!state || state.mixIndex !== needIdx) {
          clearHandoffRecovery();
          performMixHandoffIfNeeded(false);
          return;
        }
        const pos = state.positionSec;
        if (isSlotPlayable(handoffSide, pos)) {
          clearHandoffRecovery();
          completeGaplessHandoff(handoffSide, needIdx, pos, "standby_ready_after_wait");
          return;
        }
        prepareAudioSide(handoffSide, needIdx, pos);
        applySlotSeek(handoffSide, pos);

        if (Date.now() >= handoffRecoveryDeadlineMs) {
          clearHandoffRecovery();
          radioLog("error", "handoff_forced_underbuffered", {
            ...slotReadinessDetail(handoffSide, pos),
            needMixIndex: needIdx,
            atBoundary: handoffRecoveryAtBoundary
          });
          completeGaplessHandoff(handoffSide, needIdx, pos, "forced_underbuffered");
        }
      }, BROADCAST_HANDOFF_POLL_MS);
    }

    function scheduleBoundaryHandoff() {
      clearBroadcastSchedulers();
      const state = resolveBroadcastState();
      if (!state) return;

      const remainMs = mixRemainingSec(state) * 1000;
      const nextIdx = nextMixIndex(state.mixIndex);
      const preloadDelay = Math.max(0, remainMs - BROADCAST_PRELOAD_LEAD_SEC * 1000);

      preloadLeadTimer = setTimeout(() => {
        preloadLeadTimer = null;
        prepareAudioSide(standbyAudioSide(), nextIdx, 0);
      }, preloadDelay);

      if (remainMs <= BROADCAST_PRELOAD_LEAD_SEC * 1000) {
        prepareAudioSide(standbyAudioSide(), nextIdx, 0);
      }

      boundaryHandoffTimer = setTimeout(() => {
        boundaryHandoffTimer = null;
        performMixHandoffIfNeeded(true);
        scheduleBoundaryHandoff();
      }, Math.max(0, remainMs));
    }

    function performMixHandoffIfNeeded(atBoundary = false) {
      const state = resolveBroadcastState();
      if (!state) return false;

      const activeMix = slotMixIndex[activeAudioSide];
      if (activeMix === state.mixIndex) {
        ensureStandbyPreparedForNextMix(state);
        scheduleBoundaryHandoff();
        return false;
      }

      const needIdx = state.mixIndex;
      const needPos = state.positionSec;
      const handoffSide = standbyAudioSide();

      if (slotMixIndex[handoffSide] !== needIdx) {
        prepareAudioSide(handoffSide, needIdx, needPos);
      } else {
        applySlotSeek(handoffSide, needPos);
      }

      if (!isSlotPlayable(handoffSide, needPos)) {
        scheduleStandbyHandoffRecovery(handoffSide, needIdx, needPos, atBoundary);
        return false;
      }

      clearHandoffRecovery();
      return completeGaplessHandoff(handoffSide, needIdx, needPos, "standby_ready");
    }

    function recoverBroadcastFromClock(forceHandoff = false) {
      const state = resolveBroadcastState();
      if (!state) return;
      clearBroadcastSchedulers();

      const activeMix = slotMixIndex[activeAudioSide];
      if (activeMix !== state.mixIndex || forceHandoff) {
        performMixHandoffIfNeeded(false);
      } else {
        syncAudioToBroadcast(true);
        scheduleBoundaryHandoff();
      }
      syncNowPlayingFromBroadcast();
    }

    function mixPositionSeconds() {
      const state = resolveBroadcastState();
      if (!state) return 0;
      const active = activeAudioEl();
      if (
        slotMixIndex[activeAudioSide] === state.mixIndex &&
        Number.isFinite(active.duration) &&
        active.duration > 0
      ) {
        return active.currentTime;
      }
      return state.positionSec;
    }

    function syncAudioToBroadcast(force = false) {
      const state = resolveBroadcastState();
      if (!state) return false;

      if (slotMixIndex[activeAudioSide] !== state.mixIndex) {
        return performMixHandoffIfNeeded(false);
      }

      prepareAudioSide(activeAudioSide, state.mixIndex, state.positionSec);
      const active = activeAudioEl();
      if (active.readyState < HTMLMediaElement.HAVE_METADATA) return true;

      const mixDuration = broadcastMixes[state.mixIndex].durationSec;
      const expected = state.positionSec;
      const actual = active.currentTime;
      let diff = Math.abs(actual - expected);
      if (diff > mixDuration / 2) diff = mixDuration - diff;

      if (force || diff > BROADCAST_DRIFT_THRESHOLD_SEC) {
        if (active.seeking) return true;
        applySlotSeek(activeAudioSide, expected);
        lastDriftCorrectMs = Date.now();
      }
      return true;
    }

    function maybeCorrectBroadcastDrift() {
      const state = resolveBroadcastState();
      if (!state) return;

      const active = activeAudioEl();
      if (slotMixIndex[activeAudioSide] !== state.mixIndex) {
        performMixHandoffIfNeeded(false);
        return;
      }
      if (active.paused || active.seeking) return;

      const now = Date.now();
      if (now - lastDriftCorrectMs < BROADCAST_DRIFT_MIN_INTERVAL_MS) return;

      const mixDuration = broadcastMixes[state.mixIndex].durationSec;
      const expected = state.positionSec;
      const actual = active.currentTime;
      let diff = Math.abs(actual - expected);
      if (diff > mixDuration / 2) diff = mixDuration - diff;

      if (diff > BROADCAST_DRIFT_THRESHOLD_SEC) {
        applySlotSeek(activeAudioSide, expected);
        lastDriftCorrectMs = now;
      }
    }

    function broadcastAudioTick() {
      const state = resolveBroadcastState();
      if (!state) return;

      if (slotMixIndex[activeAudioSide] !== state.mixIndex) {
        performMixHandoffIfNeeded(false);
        return;
      }

      ensureStandbyPreparedForNextMix(state);
      const remain = mixRemainingSec(state);
      const standby = standbyAudioSide();
      const nextIdx = nextMixIndex(state.mixIndex);
      if (remain <= BROADCAST_PRELOAD_LEAD_SEC && !isSlotPlayable(standby, 0)) {
        radioLog("warn", "standby_preload_behind", {
          remainSec: remain,
          nextMixIndex: nextIdx,
          ...slotReadinessDetail(standby, 0)
        });
      }
    }

    function startBroadcastAudioLoop() {
      if (broadcastTickTimer !== null) return;
      broadcastTickTimer = setInterval(broadcastAudioTick, BROADCAST_TICK_MS);
    }

    function scheduleBroadcastStartCheck() {
      if (broadcastWaitTimer !== null) {
        clearTimeout(broadcastWaitTimer);
        broadcastWaitTimer = null;
      }
      if (resolveBroadcastState() !== null) return;
      const msUntil = BROADCAST_START_MS - Date.now();
      if (msUntil <= 0) return;
      broadcastWaitTimer = setTimeout(() => {
        broadcastWaitTimer = null;
        syncNowPlayingFromBroadcast();
        tryStartMutedPlayback();
      }, Math.min(msUntil, 2147483647));
    }

    function syncNowPlayingFromBroadcast() {
      const state = resolveBroadcastState();
      const mixIndex = state?.mixIndex ?? 0;
      const t = state?.positionSec ?? 0;
      const tracks = broadcastMixes[mixIndex].tracks;
      const idx = trackIndexAt(t, tracks);
      if (idx !== nowPlayingTrackIndex || mixIndex !== nowPlayingMixIndex) {
        nowPlayingMixIndex = mixIndex;
        nowPlayingTrackIndex = idx;
        applyNowPlaying(tracks[idx]);
      }
    }

    function artistLineFor(track) {
      return track.artists.map((a) => a.name).join(", ");
    }

    function artistLineUpper(track) {
      return track.artists.map((a) => a.name.toUpperCase()).join(", ");
    }

    function titleSegmentWidth(bctx, text) {
      if (!text) return 0;
      return muteTextMetrics(bctx, text, fontSize, TITLE_LETTER_SPACING).width;
    }

    function titlePrefixWidth(bctx, fullLine, endIndex) {
      if (endIndex <= 0) return 0;
      return titleSegmentWidth(bctx, fullLine.slice(0, endIndex));
    }

    function titleSliceWidth(bctx, fullLine, startIndex, endIndex) {
      if (endIndex <= startIndex) return 0;
      return titlePrefixWidth(bctx, fullLine, endIndex) - titlePrefixWidth(bctx, fullLine, startIndex);
    }

    function measureTitleInkSegments(bctx, track, songUpper, startXDev) {
      let x = startXDev;
      const artists = [];
      track.artists.forEach((artist, index) => {
        if (index > 0) x += titleSegmentWidth(bctx, ", ");
        const label = artist.name.toUpperCase();
        const w = titleSegmentWidth(bctx, label);
        artists.push({ href: artist.href, name: artist.name, x: x, w: w });
        x += w;
      });
      const gapW = titleSegmentWidth(bctx, "   ");
      const gap = { x: x, w: gapW };
      x += gapW;
      const songW = titleSegmentWidth(bctx, songUpper);
      const song = { x: x, w: songW };
      return { artists, gap, song };
    }

    function drawTitleInkSegments(bctx, track, songUpper, textXDev, textY, fillStyle) {
      bctx.letterSpacing = TITLE_LETTER_SPACING;
      bctx.font = fontOf(fontSize);
      bctx.fillStyle = fillStyle;
      bctx.textAlign = "left";
      bctx.textBaseline = "alphabetic";

      let x = textXDev;
      track.artists.forEach((artist, index) => {
        if (index > 0) {
          const sep = ", ";
          bctx.fillText(sep, x, textY);
          x += titleSegmentWidth(bctx, sep);
        }
        const label = artist.name.toUpperCase();
        bctx.fillText(label, x, textY);
        x += titleSegmentWidth(bctx, label);
      });
      const gap = "   ";
      bctx.fillText(gap, x, textY);
      x += titleSegmentWidth(bctx, gap);
      bctx.fillText(songUpper, x, textY);
    }

    function titleLinkLayout(line) {
      const probe = layers.white.getContext("2d");
      const block = titleLineMetrics(probe, line);
      if (!block) return null;

      const wCss = canvas.clientWidth || LAYOUT_CSS_W;
      const hCss = canvas.clientHeight || LAYOUT_TITLE_H;
      const xScale = wCss / canvas.width;
      const yScale = hCss / canvas.height;
      const midYDev = canvas.height * 0.5;

      let textXDev = (canvas.width - block.blockW) / 2 + block.inset.x;
      textXDev = Math.max(block.inset.x, Math.min(textXDev, canvas.width - block.blockW - block.inset.x));
      const textX = textXDev * xScale;

      const textYDev = midYDev - block.blockH / 2 + block.inset.y + block.metrics.ascent;
      const bandTop = (textYDev - block.metrics.ascent) * yScale;
      const bandH = block.metrics.height * yScale;

      return { textX, bandTop, bandH, probe };
    }

    function layoutTitleLinks(track) {
      if (!titleLinksHost || !canvas) return;
      titleLinksHost.innerHTML = "";

      const song = track.song.toUpperCase();
      const artistLine = artistLineUpper(track);
      const fullLine = titleLineText(artistLine, song);
      const layout = titleLinkLayout(fullLine);
      if (!layout) return;

      const { textX, bandTop, bandH, probe } = layout;
      const wCss = canvas.clientWidth || LAYOUT_CSS_W;
      const xScale = wCss / canvas.width;
      const textXDev = textX / xScale;
      const segs = measureTitleInkSegments(probe, track, song, textXDev);

      const toCss = (xDev, wDev) => ({
        left: xDev * xScale,
        width: Math.max(0, wDev * xScale)
      });

      const addShield = (className, box) => {
        if (box.width <= 0) return;
        const shield = document.createElement("span");
        shield.className = className;
        shield.setAttribute("aria-hidden", "true");
        shield.style.left = `${box.left}px`;
        shield.style.top = `${bandTop}px`;
        shield.style.width = `${box.width}px`;
        shield.style.height = `${bandH}px`;
        titleLinksHost.appendChild(shield);
      };

      addShield("title-gap-shield", toCss(segs.gap.x, segs.gap.w));
      addShield("title-song-shield", toCss(segs.song.x, segs.song.w));

      segs.artists.forEach((seg) => {
        const box = toCss(seg.x, seg.w);
        const a = document.createElement("a");
        a.href = seg.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", `${seg.name} on Instagram`);
        a.style.left = `${box.left}px`;
        a.style.top = `${bandTop}px`;
        a.style.width = `${Math.max(1, box.width)}px`;
        a.style.height = `${bandH}px`;
        titleLinksHost.appendChild(a);
      });
    }

    function applyNowPlaying(track) {
      const artistLine = artistLineFor(track);
      artistText = artistLine.toUpperCase();
      songText = track.song.toUpperCase();
      titleDisplayText = titleLineText(artistText, songText);
      heading.textContent = titleDisplayText;
      layoutTitleLinks(track);
    }

    function syncNowPlayingFromAudio() {
      const active = activeAudioEl();
      if (active.paused && !playbackUnlocked) {
        syncNowPlayingFromBroadcast();
        return;
      }
      maybeCorrectBroadcastDrift();
      const state = resolveBroadcastState();
      if (!state) return;
      const tracks = broadcastMixes[state.mixIndex].tracks;
      const t = mixPositionSeconds();
      const idx = trackIndexAt(t, tracks);
      if (idx !== nowPlayingTrackIndex || state.mixIndex !== nowPlayingMixIndex) {
        nowPlayingMixIndex = state.mixIndex;
        nowPlayingTrackIndex = idx;
        applyNowPlaying(tracks[idx]);
      }
    }

    async function tryStartMutedPlayback() {
      if (resolveBroadcastState() === null) {
        scheduleBroadcastStartCheck();
        syncNowPlayingFromBroadcast();
        return false;
      }
      syncAudioToBroadcast(true);
      syncBroadcastMuteState();
      const active = activeAudioEl();
      try {
        await active.play();
        await resumeRadioAudioContext();
        syncNowPlayingFromAudio();
      } catch {
        return false;
      }
      return true;
    }

    function syncBroadcastMuteState() {
      bgmA.muted = audioMuted;
      bgmB.muted = audioMuted;
    }

    function onAudioPlaybackSignal() {
      if (radioAnalyser && radioStreamTaps.length === 0) {
        attachRadioAnalyserTaps();
      }
      syncNowPlayingFromAudio();
    }

    let radioAudioInited = false;

    let radioStreamTaps = [];

    function detachRadioAnalyserTaps() {
      for (const node of radioStreamTaps) {
        try {
          node.disconnect();
        } catch {
          /* ignore */
        }
      }
      radioStreamTaps = [];
    }

    function attachRadioAnalyserTaps() {
      if (!radioAnalyser || !radioAudioCtx) return;
      detachRadioAnalyserTaps();
      for (const el of [bgmA, bgmB]) {
        if (typeof el.captureStream !== "function") continue;
        let stream;
        try {
          stream = el.captureStream();
        } catch {
          continue;
        }
        const src = radioAudioCtx.createMediaStreamSource(stream);
        src.connect(radioAnalyser);
        radioStreamTaps.push(src);
      }
    }

    function initRadioAudioAnalyser() {
      if (radioAnalyser) return;
      try {
        radioAudioCtx = new AudioContext();
        radioAnalyser = radioAudioCtx.createAnalyser();
        radioAnalyser.fftSize = 256;
        radioAnalyser.smoothingTimeConstant = 0.55;
        radioAnalyser.minDecibels = -88;
        radioAnalyser.maxDecibels = -18;
        attachRadioAnalyserTaps();
      } catch {
        detachRadioAnalyserTaps();
        radioAnalyser = null;
        radioAudioCtx = null;
      }
    }

    async function resumeRadioAudioContext() {
      if (radioAudioCtx && radioAudioCtx.state === "suspended") {
        try {
          await radioAudioCtx.resume();
        } catch {
          /* ignore */
        }
      }
    }

    function pushScannerColumn() {
      let sample = 0.07 + Math.random() * 0.05;
      const active = activeAudioEl();
      const playing = active && !active.paused;

      let peakNorm = 0;
      if (radioAnalyser && playing) {
        const bins = new Uint8Array(radioAnalyser.frequencyBinCount);
        radioAnalyser.getByteFrequencyData(bins);
        let sum = 0;
        let peak = 0;
        const i0 = 1;
        const i1 = Math.min(bins.length - 1, 48);
        for (let i = i0; i <= i1; i++) {
          sum += bins[i];
          peak = Math.max(peak, bins[i]);
        }
        const avg = sum / (i1 - i0 + 1) / 255;
        peakNorm = peak / 255;
        sample = avg * 0.55 + peakNorm * 0.75;
        if (audioMuted) {
          sample = sample * 0.42 + 0.06;
        } else {
          sample = Math.min(1, sample * 1.2 + 0.1);
        }
      } else if (playing && audioMuted) {
        sample = 0.12 + Math.random() * 0.08;
      } else if (Math.random() < 0.035) {
        sample = 0.14 + Math.random() * 0.22;
      }

      scannerCols.copyWithin(0, 1);
      scannerWidths.copyWithin(0, 1);

      const hotSignal = sample > 0.32 || peakNorm > 0.42;
      const tierRoll = Math.random();
      let widthMix;

      if (tierRoll < 0.34) {
        widthMix = 0.07 + Math.random() * 0.22;
      } else if (tierRoll < 0.58) {
        widthMix = 0.38 + Math.random() * 0.36;
      } else {
        widthMix = 0.9 + Math.random() * 0.62;
        sample = Math.max(sample, 0.22 + Math.random() * 0.35);
      }

      if (!audioMuted && playing) {
        if (hotSignal && Math.random() < 0.42) {
          widthMix = Math.max(widthMix, 0.95 + Math.random() * 0.58);
          sample = Math.max(sample, 0.35 + peakNorm * 0.45);
        } else if (Math.random() < 0.22) {
          widthMix = Math.max(widthMix, 0.82 + Math.random() * 0.48);
        }
      } else if (Math.random() < 0.14) {
        widthMix = Math.max(widthMix, 0.78 + Math.random() * 0.45);
        sample = Math.max(sample, 0.18 + Math.random() * 0.2);
      }

      if (Math.random() < 0.24) {
        widthMix = 1.08 + Math.random() * 0.58;
        sample = Math.max(sample, 0.34 + Math.random() * 0.42);
      }

      scannerCols[SCANNER_COLS - 1] = Math.min(1, Math.max(0, sample));
      scannerWidths[SCANNER_COLS - 1] = Math.min(1.7, Math.max(0.07, widthMix));
    }

    function scannerContentBox(w, h) {
      const inset = hudPanelInsets(hudFontSize);
      const margin = 1;
      const x = margin + inset.x;
      const y = margin + inset.y;
      return {
        margin,
        inset,
        x,
        y,
        width: Math.max(8, w - 2 * (margin + inset.x)),
        height: Math.max(8, h - 2 * (margin + inset.y))
      };
    }

    const scannerPhosphorRgb = [132, 255, 178];

    function scannerPhosphorRgba(a, channelAlpha = 1) {
      const [r, g, b] = scannerPhosphorRgb;
      return `rgba(${r}, ${g}, ${b}, ${a * channelAlpha})`;
    }

    function paintScannerSignal(bctx, plot, channelAlpha = 1) {
      bctx.save();
      bctx.imageSmoothingEnabled = false;
      bctx.beginPath();
      bctx.rect(plot.x, plot.y, plot.width, plot.height);
      bctx.clip();

      const step = Math.max(2, Math.round(plot.width / 22));
      bctx.strokeStyle = `rgba(0, 95, 48, ${0.22 * channelAlpha})`;
      bctx.lineWidth = 1;
      for (let x = plot.x; x < plot.x + plot.width; x += step) {
        bctx.beginPath();
        bctx.moveTo(x + 0.5, plot.y);
        bctx.lineTo(x + 0.5, plot.y + plot.height);
        bctx.stroke();
      }
      for (let y = plot.y; y < plot.y + plot.height; y += step) {
        bctx.beginPath();
        bctx.moveTo(plot.x, y + 0.5);
        bctx.lineTo(plot.x + plot.width, y + 0.5);
        bctx.stroke();
      }

      const plotTop = plot.y;
      const plotBottom = plot.y + plot.height;
      const plotH = plot.height;
      const colW = plot.width / SCANNER_COLS;

      for (let i = 0; i < SCANNER_COLS; i++) {
        const v = scannerCols[i];
        if (v < 0.03) continue;

        const x = plot.x + (i + 0.5) * colW;
        const widthT = scannerWidths[i] || 0.5;
        const thin = widthT < 0.32;
        const lw = Math.max(0.75, colW * (0.16 + widthT * 0.95));
        const glowW = lw * (thin ? 1.15 : 1.55);
        const coreBoost = thin ? 0.85 : 1;

        bctx.fillStyle = `rgba(45, 255, 125, ${(0.03 + v * 0.2) * (0.7 + widthT * 0.55) * channelAlpha})`;
        bctx.fillRect(x - glowW / 2, plotTop, glowW, plotH);

        const core = bctx.createLinearGradient(0, plotTop, 0, plotBottom);
        const edgeA = (0.08 + v * 0.22) * coreBoost;
        const midA = (0.22 + v * 0.62) * (0.85 + widthT * 0.35);
        core.addColorStop(0, scannerPhosphorRgba(edgeA, channelAlpha));
        core.addColorStop(0.35, scannerPhosphorRgba(midA, channelAlpha));
        core.addColorStop(0.65, scannerPhosphorRgba(midA * 0.95, channelAlpha));
        core.addColorStop(1, scannerPhosphorRgba(edgeA, channelAlpha));
        bctx.strokeStyle = core;
        bctx.lineWidth = lw;
        bctx.beginPath();
        bctx.moveTo(x, plotTop);
        bctx.lineTo(x, plotBottom);
        bctx.stroke();

        if (v > 0.28 && widthT > 0.4) {
          bctx.strokeStyle = scannerPhosphorRgba(0.12 + (v - 0.28) * (0.55 + widthT * 0.45), channelAlpha);
          bctx.lineWidth = Math.max(0.75, lw * (thin ? 0.55 : 0.38));
          bctx.beginPath();
          bctx.moveTo(x, plotTop);
          bctx.lineTo(x, plotBottom);
          bctx.stroke();
        }

        if (!thin && v > 0.42 && widthT > 0.75) {
          bctx.strokeStyle = scannerPhosphorRgba(0.08 + (v - 0.42) * 0.35, channelAlpha);
          bctx.lineWidth = Math.max(1, lw * 0.22);
          bctx.beginPath();
          bctx.moveTo(x, plotTop);
          bctx.lineTo(x, plotBottom);
          bctx.stroke();
        }
      }

      const sweepX = plot.x + plot.width - 1;
      bctx.strokeStyle = `rgba(150, 255, 190, ${0.5 * channelAlpha})`;
      bctx.lineWidth = 1;
      bctx.beginPath();
      bctx.moveTo(sweepX, plotTop);
      bctx.lineTo(sweepX, plotBottom);
      bctx.stroke();

      bctx.restore();
    }

    function paintScannerLayers() {
      const w = scannerCanvas.width;
      const h = scannerCanvas.height;
      const plot = scannerContentBox(w, h);

      for (const [name, layer] of Object.entries(scannerLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        drawHudHighlight(bctx, 0, 0, w, h, hudPanel);
        const alpha = name === "white" ? 1 : name === "red" ? 0.82 : 0.88;
        paintScannerSignal(bctx, plot, alpha);
      }
    }

    function initRadioAudio() {
      if (radioAudioInited) return;
      radioAudioInited = true;
      initRadioAudioAnalyser();

      wireAudioSlot(0);
      wireAudioSlot(1);
      bgmA.loop = false;
      bgmB.loop = false;
      syncBroadcastMuteState();

      const boot = resolveBroadcastState();
      const mixIdx = boot?.mixIndex ?? 0;
      const pos = boot?.positionSec ?? 0;
      activeAudioSide = 0;
      bgm = bgmA;
      prepareAudioSide(0, mixIdx, pos);
      prepareAudioSide(1, nextMixIndex(mixIdx), 0);
      if (boot) ensureStandbyPreparedForNextMix(boot);

      bgmA.addEventListener("timeupdate", onAudioPlaybackSignal);
      bgmB.addEventListener("timeupdate", onAudioPlaybackSignal);
      bgmA.addEventListener("play", onAudioPlaybackSignal);
      bgmB.addEventListener("play", onAudioPlaybackSignal);
      bgmA.addEventListener("seeked", onAudioPlaybackSignal);
      bgmB.addEventListener("seeked", onAudioPlaybackSignal);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          recoverBroadcastFromClock(true);
        }
      });
      window.addEventListener("pageshow", (ev) => {
        if (ev.persisted) recoverBroadcastFromClock(true);
      });
      window.addEventListener("focus", () => recoverBroadcastFromClock(false));

      syncNowPlayingFromBroadcast();
      scheduleBroadcastStartCheck();
      scheduleBoundaryHandoff();
      startBroadcastAudioLoop();

      const startWhenReady = () => {
        syncAudioToBroadcast(true);
        tryStartMutedPlayback();
      };
      if (bgmA.readyState >= HTMLMediaElement.HAVE_METADATA) {
        startWhenReady();
      } else {
        bgmA.addEventListener("loadedmetadata", startWhenReady, { once: true });
      }

      scheduleTitleGlitch();
      scheduleScreenGlitch();
    }

    function hudPanelInsets(size) {
      return {

    function drawHudHighlight(bctx, x, y, w, h, panel = hudPanel) {
      bctx.fillStyle = panel.fill;

    function drawLabeledLine(bctx, text, textX, baselineY, metrics, size, fillStyle, panel = hudPanel, drawPanel = true) {
      const inset = hudPanelInsets(size);
      if (drawPanel) {
        const barW = metrics.width + inset.x * 2;
        const barH = metrics.height + inset.y * 2;
        const barX = textX - inset.x;
        const barY = baselineY - metrics.ascent - inset.y;
        drawHudHighlight(bctx, barX, barY, barW, barH, panel);
      }
      bctx.fillStyle = fillStyle;
      bctx.fillText(text, textX, baselineY);

    function muteIconCells(muted) {
      const body = [
        [1, 2], [1, 3], [1, 4],
        [2, 1], [2, 2], [2, 3], [2, 4], [2, 5],
        [3, 0], [3, 1], [3, 2], [3, 3], [3, 4], [3, 5],
        [4, 0], [4, 1], [4, 2], [4, 3], [4, 4], [4, 5],
        [5, 1], [5, 2], [5, 3], [5, 4]
      ];
      const waves = [[7, 2], [8, 2], [9, 2], [7, 3], [8, 3], [9, 3], [10, 3], [8, 4], [9, 4]];
      const strike = [[7, 1], [8, 2], [9, 3], [10, 4], [10, 1], [9, 2], [8, 3], [7, 4]];
      return muted ? body.concat(strike) : body.concat(waves);
    }

    function pixelIconMetrics(cells) {
      let minGx = Infinity;
      let maxGx = -Infinity;
      let minGy = Infinity;
      let maxGy = -Infinity;
      for (const [gx, gy] of cells) {
        minGx = Math.min(minGx, gx);
        maxGx = Math.max(maxGx, gx);
        minGy = Math.min(minGy, gy);
        maxGy = Math.max(maxGy, gy);
      }
      return { minGx, maxGx, minGy, maxGy, cols: maxGx - minGx + 1, rows: maxGy - minGy + 1 };
    }

    function muteIconMetrics(muted) {
      return pixelIconMetrics(muteIconCells(muted));
    }

    const vcrMonths = [
      "JAN.", "FEB.", "MAR.", "APR.", "MAY.", "JUN.",

    function vcrTimeLabel() {
      const now = new Date();
      const h = now.getHours();
      const ampm = h >= 12 ? "PM" : "AM";
      const hour12 = h % 12 || 12;
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${ampm} ${hour12}:${mm}:${ss}`;
    }

    function vcrDateLabel() {
      const now = new Date();
      const mon = vcrMonths[now.getMonth()];
      const day = String(now.getDate()).padStart(2, "0");
      return `${mon}${day} ${now.getFullYear()}`;
    }

    function widestHudTextWidth(probe, labels) {
      let maxW = 0;
      for (const label of labels) {
        maxW = Math.max(maxW, muteTextMetrics(probe, label).width);
      }
      return maxW;
    }

    function timeCanvasSampleLabels() {
      return ["AM 1:59:59", "PM 12:59:59"];

    function dateCanvasSampleLabels() {
      const year = new Date().getFullYear();
      return vcrMonths.map((mon) => `${mon}29 ${year}`);
    }

    function syncDatetimeClock() {
      const now = new Date();
      const tick = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      if (tick === datetimeLastTick) return;
      datetimeLastTick = tick;
      datetimeTimeText = vcrTimeLabel();
      datetimeDateText = vcrDateLabel();
      if (!dockLayoutFrozen) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        resizeTimeCanvas(dpr);

    function muteTextMetrics(bctx, label, size = hudFontSize, letterSpacing = HUD_LETTER_SPACING) {
      bctx.font = fontOf(size);
      bctx.letterSpacing = letterSpacing;
      const metrics = bctx.measureText(label);
      const ascent = Math.max(metrics.actualBoundingBoxAscent || 0, size * 0.78);
      const descent = Math.max(metrics.actualBoundingBoxDescent || 0, size * 0.3);
      return {
        width: metrics.width,
        ascent,
        descent,
        height: ascent + descent,
        gap: bctx.measureText(" ").width,
        baselineForMid(midY) {
          return midY + (ascent - descent) / 2;
        }
      };
    }

    function brandDotState(now) {
      const flashPeriod = PLAY_VISIBLE_MS + PLAY_HIDDEN_MS;
      const flashIndex = Math.floor(now / flashPeriod) % DOT_SIZE_SCALES.length;
      const visible = now % flashPeriod < PLAY_VISIBLE_MS;
      return { visible, scale: DOT_SIZE_SCALES[flashIndex] };
    }

    function drawIconLabelMark(bctx, ox, canvasH, cell, fillStyle, iconCells, label, showIcon = true, panel = hudPanel, drawPanel = true) {
      bctx.letterSpacing = HUD_LETTER_SPACING;
      bctx.font = fontOf(hudFontSize);

      const { minGx, maxGx, minGy, maxGy } = pixelIconMetrics(iconCells);
      const iconW = (maxGx - minGx + 1) * cell;
      const rowY = canvasH / 2;
      const avgGy = iconCells.reduce((sum, [, gy]) => sum + gy, 0) / iconCells.length;
      const iconMidOffset = (avgGy - minGy + 0.5) * cell;
      const iconTop = rowY - iconMidOffset;
      const text = muteTextMetrics(bctx, label);
      const textX = ox + iconW + text.gap;
      const iconH = (maxGy - minGy + 1) * cell;
      const rowH = Math.max(iconH, text.height);
      const inset = hudPanelInsets(hudFontSize);
      const contentW = (showIcon ? iconW + text.gap : 0) + text.width;
      if (drawPanel) {
        const barW = contentW + inset.x * 2;
        const barH = rowH + inset.y * 2;
        const barX = ox - inset.x;
        const barY = rowY - rowH / 2 - inset.y;
        drawHudHighlight(bctx, barX, barY, barW, barH, panel);
      }

      bctx.fillStyle = fillStyle;
      if (showIcon) {
        for (const [gx, gy] of iconCells) {
          bctx.fillRect(
            ox + (gx - minGx) * cell,
            iconTop + (gy - minGy) * cell,
            cell - 0.6,
            cell - 0.6
          );
        }
      }

      bctx.textAlign = "left";
      bctx.textBaseline = "alphabetic";
      bctx.fillText(label, textX, text.baselineForMid(rowY));
    }

    function iconLabelBoxWidth(iconCells, label) {
      const probe = layers.white.getContext("2d");
      const cell = hudFontSize * 0.12;
      const { minGx, maxGx } = pixelIconMetrics(iconCells);
      const iconW = (maxGx - minGx + 1) * cell;
      const text = muteTextMetrics(probe, label);
      const pad = hudFontSize * 0.28;
      return pad + iconW + text.gap + text.width + pad;
    }

    function dockRowCanvasHeight(label, muted) {
      return Math.ceil(muteContentHeight(label, muted));
    }

    function brandDotBoxMetrics(rowH) {
      const probe = layers.white.getContext("2d");
      const text = muteTextMetrics(probe, "0");
      const inset = hudPanelInsets(hudFontSize);
      const margin = 1;
      const inner = text.height;
      const dotR = text.height * 0.36;
      const w = margin * 2 + inset.x * 2 + inner;
      const h = rowH;
      return { w, h, margin, inset, inner, dotR };
    }

    function hudTextBoxMetrics(rowH, label, minWidth = 0) {
      const probe = layers.white.getContext("2d");
      probe.letterSpacing = HUD_LETTER_SPACING;
      probe.font = fontOf(hudFontSize);
      const line = muteTextMetrics(probe, label);
      const inset = hudPanelInsets(hudFontSize);
      const margin = 1;
      const textW = Math.max(line.width, minWidth);
      const w = margin * 2 + inset.x * 2 + textW;
      const h = rowH;
      return { w, h, margin, inset, line, textW };
    }

    function drawHudTextLine(bctx, box, text, fillStyle) {
      const { margin, inset, line } = box;

    function drawBrandDotMark(bctx, w, h, fillStyle, showDot, scale, box) {
      if (!showDot) return;
      const cx = box.margin + box.inset.x + box.inner / 2;
      const cy = h / 2;
      const dotR = box.dotR * scale;

      bctx.fillStyle = fillStyle;
      bctx.beginPath();
      bctx.arc(cx, cy, dotR, 0, Math.PI * 2);

    function layoutDockSlots(reseatChainFromMute = false) {
      const inner = document.querySelector(".vcr-dock-inner");
      const dock = document.querySelector(".vcr-dock");
      const timeEl = document.querySelector(".vcr-time");
      const dateEl = document.querySelector(".vcr-date");
      const sludgeEl = document.querySelector(".vcr-sludge");
      const brandEl = document.querySelector(".vcr-brand");
      const muteEl = document.getElementById("mute");
      if (!inner || !dock || !timeEl || !dateEl || !sludgeEl || !brandEl || !muteEl) return;

      const rowH = dockRowCanvasHeight(muteLabelText, audioMuted);
      inner.style.height = `${rowH}px`;

      const setLeft = (el, leftPx) => {
        el.style.left = `${leftPx}px`;
        el.style.right = "auto";
      };

      const gap = HUD_ITEM_GAP_PX;
      const row = [timeEl, dateEl, muteEl, sludgeEl, brandEl];

      if (!dockLayoutFrozen) {
        let x = 0;
        for (const el of row) {
          setLeft(el, x);
          frozenSlotLeft[el.classList.contains("vcr-time") ? "time"
            : el.classList.contains("vcr-date") ? "date"
            : el.classList.contains("vcr-mute") ? "mute"
            : el.classList.contains("vcr-sludge") ? "sludge"
            : "brand"] = x;
          x += el.offsetWidth + gap;
        }
        frozenDockInnerWidth = x - gap;
        inner.style.width = `${frozenDockInnerWidth}px`;
        inner.style.minWidth = `${frozenDockInnerWidth}px`;
        inner.style.maxWidth = `${frozenDockInnerWidth}px`;
        dockLayoutFrozen = true;
      } else if (reseatChainFromMute) {
        setLeft(timeEl, frozenSlotLeft.time);
        setLeft(dateEl, frozenSlotLeft.date);
        setLeft(muteEl, frozenSlotLeft.mute);
        let x = frozenSlotLeft.mute + muteEl.offsetWidth + gap;
        setLeft(sludgeEl, x);
        frozenSlotLeft.sludge = x;
        x += sludgeEl.offsetWidth + gap;
        setLeft(brandEl, x);
        frozenSlotLeft.brand = x;
        frozenDockInnerWidth = x + brandEl.offsetWidth;
        inner.style.width = `${frozenDockInnerWidth}px`;
        inner.style.minWidth = `${frozenDockInnerWidth}px`;
        inner.style.maxWidth = `${frozenDockInnerWidth}px`;
      } else {
        setLeft(timeEl, frozenSlotLeft.time);
        setLeft(dateEl, frozenSlotLeft.date);
        setLeft(muteEl, frozenSlotLeft.mute);
        setLeft(sludgeEl, frozenSlotLeft.sludge);
        setLeft(brandEl, frozenSlotLeft.brand);
      }

      const dockRect = dock.getBoundingClientRect();
      const muteRect = muteEl.getBoundingClientRect();
      frozenMuteBar = {
        left: muteRect.left - dockRect.left,
        width: muteRect.width
      };
    }

    function dockBarLayout(dpr) {
      const dock = document.querySelector(".vcr-dock");
      const cssW = dock ? dock.clientWidth : Math.max(LAYOUT_CSS_W, window.innerWidth - 30);
      const cssH = dockRowCanvasHeight(muteLabelText, audioMuted) / dpr;
      const muteLeft = frozenMuteBar.left;
      const muteCssW = frozenMuteBar.width;
      return { cssW, cssH, muteLeft, muteCssW };
    }

    function resizeDockBarCanvas(dpr) {
      const { cssW, cssH } = dockBarLayout(dpr);
      const w = Math.ceil(cssW * dpr);
      const h = Math.ceil(cssH * dpr);
      dockBarCanvas.width = w;
      dockBarCanvas.height = h;
      dockBarCanvas.style.width = `${cssW}px`;
      dockBarCanvas.style.height = `${cssH}px`;
      for (const layer of Object.values(dockBarLayers)) {
        layer.width = w;
        layer.height = h;
      }
    }

    function paintDockBarLayers() {
      const w = dockBarCanvas.width;
      const h = dockBarCanvas.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const layout = dockBarLayout(dpr);
      const muteW = Math.ceil(layout.muteCssW * dpr);
      const muteX = Math.round(layout.muteLeft * dpr);

      for (const [name, layer] of Object.entries(dockBarLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        drawHudHighlight(bctx, 0, 0, w, h, hudPanel);
        if (audioMuted) {
          drawHudHighlight(bctx, muteX, 0, muteW, h, mutePanel);
        }
      }
    }

    function dockBarFrame() {
      paintDockBarLayers();
      renderGlitch(dockBarCtx, dockBarLayers, dockBarCanvas.width, dockBarCanvas.height, screenGlitchSoft());
      requestAnimationFrame(dockBarFrame);
    }

    const bgGlitchColors = {
      white: "rgba(205, 255, 228, 0.14)",
      red: "rgba(120, 185, 155, 0.05)",
      cyan: "rgba(105, 200, 170, 0.045)"
    };
    const bgCanvas = document.getElementById("bg-tv");
    const bgCtx = bgCanvas.getContext("2d");
    const bgLayers = makeLayerSetFrom(bgGlitchColors);

    function resizeBgCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = window.innerWidth;
      const cssH = window.innerHeight;
      const w = Math.ceil(cssW * dpr);
      const h = Math.ceil(cssH * dpr);
      bgCanvas.width = w;
      bgCanvas.height = h;
      bgCanvas.style.width = `${cssW}px`;
      bgCanvas.style.height = `${cssH}px`;
      for (const layer of Object.values(bgLayers)) {
        layer.width = w;
        layer.height = h;
      }
    }

    function paintBgScene(bctx, w, h) {
      const cx = w * 0.5;
      const cy = h * 0.46;
      const g = bctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.72);
      g.addColorStop(0, "#07090c");
      g.addColorStop(0.52, "#030405");
      g.addColorStop(1, "#000000");
      bctx.fillStyle = g;
      bctx.fillRect(0, 0, w, h);

      const dpr = w / Math.max(1, window.innerWidth);
      const stepX = Math.max(1, Math.round(3 * dpr));
      const stepY = Math.max(1, Math.round(4 * dpr));

      bctx.strokeStyle = "rgba(210, 228, 238, 0.022)";
      bctx.lineWidth = 1;
      for (let x = 0; x <= w; x += stepX) {
        bctx.beginPath();
        bctx.moveTo(x + 0.5, 0);
        bctx.lineTo(x + 0.5, h);
        bctx.stroke();
      }
      bctx.strokeStyle = "rgba(200, 218, 228, 0.016)";
      for (let y = 0; y <= h; y += stepY) {
        bctx.beginPath();
        bctx.moveTo(0, y + 0.5);
        bctx.lineTo(w, y + 0.5);
        bctx.stroke();
      }

      const scanStep = Math.max(1, Math.round(3 * dpr));
      bctx.fillStyle = "rgba(0, 0, 0, 0.12)";
      for (let y = 0; y < h; y += scanStep) {
        bctx.fillRect(0, y, w, 1);
      }

      const vig = bctx.createRadialGradient(cx, cy, Math.min(w, h) * 0.22, cx, cy, Math.max(w, h) * 0.75);
      vig.addColorStop(0, "rgba(0, 0, 0, 0)");
      vig.addColorStop(1, "rgba(0, 0, 0, 0.72)");
      bctx.fillStyle = vig;
      bctx.fillRect(0, 0, w, h);

      const grain = screenGlitchSoft() ? 28 : 64;
      for (let i = 0; i < grain; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const a = 0.006 + Math.random() * (screenGlitchSoft() ? 0.012 : 0.028);
        bctx.fillStyle = `rgba(210, 230, 236, ${a})`;
        bctx.fillRect(x, y, 1, 1);
      }
    }

    function paintBgLayers() {
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      for (const [name, layer] of Object.entries(bgLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        paintBgScene(bctx, w, h);
        if (name !== "white") {
          bctx.globalCompositeOperation = "source-atop";
          bctx.fillStyle = bgGlitchColors[name];
          bctx.fillRect(0, 0, w, h);
          bctx.globalCompositeOperation = "source-over";
        }
      }
    }

    function bgFrame() {
      paintBgLayers();
      const onBurst = screenGlitchIntensity > 0;
      bgCtx.globalAlpha = onBurst ? 0.38 : 0.22;
      renderGlitch(bgCtx, bgLayers, bgCanvas.width, bgCanvas.height, true);
      bgCtx.globalAlpha = 1;
      requestAnimationFrame(bgFrame);
    }

    function muteContentWidth(label, muted) {
      const probe = layers.white.getContext("2d");
      const cell = hudFontSize * 0.12;
      const { minGx, maxGx } = muteIconMetrics(muted);
      const iconW = (maxGx - minGx + 1) * cell;
      const text = muteTextMetrics(probe, label);
      const inset = hudPanelInsets(hudFontSize);
      const margin = 1;
      return margin * 2 + inset.x * 2 + iconW + text.gap + text.width;
    }

    function muteContentHeight(label, muted) {
      const probe = layers.white.getContext("2d");
      const cell = hudFontSize * 0.12;
      const { minGy, maxGy } = muteIconMetrics(muted);
      const iconH = (maxGy - minGy + 1) * cell;
      const text = muteTextMetrics(probe, label);
      const inset = hudPanelInsets(hudFontSize);
      const margin = 1;
      return margin * 2 + inset.y * 2 + Math.max(iconH, text.height);
    }

    function resizeMuteCanvas(dpr) {
      const h = Math.ceil(muteContentHeight(muteLabelText, audioMuted));
      const w = Math.ceil(muteContentWidth(muteLabelText, audioMuted));
      muteCanvas.width = w;
      muteCanvas.height = h;
      muteCanvas.style.width = `${w / dpr}px`;
      muteCanvas.style.height = `${h / dpr}px`;
      for (const layer of Object.values(muteLayers)) {
        layer.width = w;
        layer.height = h;
      }
    }

    function renderGlitch(outCtx, layerSet, w, h, soft = false) {
      outCtx.clearRect(0, 0, w, h);
      outCtx.imageSmoothingEnabled = false;

      const band = Math.max(2, Math.round(window.devicePixelRatio || 1));
      const tearAt = Math.random() * h;
      const tearSize = h * (0.045 + Math.random() * 0.07);
      const tracking = Math.random() < (soft ? 0.05 : 0.16);

      for (let y = 0; y < h; y += band) {
        let dx = (Math.random() - 0.5) * (soft ? 2.5 : 6);
        if (Math.random() < (soft ? 0.02 : 0.07)) dx += (Math.random() - 0.5) * (soft ? 8 : 24);
        if (y > tearAt && y < tearAt + tearSize) dx += tracking ? (soft ? 8 : 22) : (soft ? 4 : 9);

        const split = soft ? 1 + Math.random() * 1.1 : 2 + Math.random() * 2.5;
        outCtx.drawImage(layerSet.red, 0, y, w, band, dx + split, y, w, band);
        outCtx.drawImage(layerSet.cyan, 0, y, w, band, dx - split, y, w, band);
        if (soft || Math.random() > 0.02) {
          outCtx.drawImage(layerSet.white, 0, y, w, band, dx, y, w, band);
        }
      }

      outCtx.globalCompositeOperation = "source-atop";
      outCtx.fillStyle = `rgba(0, 0, 0, ${soft ? 0.22 : 0.42})`;
      for (let y = 0; y < h; y += band * 3) outCtx.fillRect(0, y, w, 1);

      outCtx.globalCompositeOperation = "destination-out";
      const cuts = soft ? 4 : 16;
      for (let i = 0; i < cuts; i++) {
        outCtx.fillRect(Math.random() * w, Math.random() * h, 3 + Math.random() * (soft ? 10 : 22), 1);
      }

      outCtx.globalCompositeOperation = "source-atop";
      const specks = soft ? 10 : 36;
      for (let i = 0; i < specks; i++) {
        const bright = Math.random() > 0.4;
        outCtx.fillStyle = bright
          ? `rgba(255, 255, 255, ${0.35 + Math.random() * 0.5})`
          : `rgba(${160 + Math.random() * 80}, ${40 + Math.random() * 40}, 255, ${0.4 + Math.random() * 0.4})`;
        outCtx.fillRect(Math.random() * w, (Math.random() * h) | 0, 2 + Math.random() * (soft ? 10 : 18), 1);
      }

      if (tracking && !soft) {
        outCtx.fillStyle = "rgba(255, 255, 255, 0.35)";
        outCtx.fillRect(0, tearAt, w, Math.max(2, tearSize * 0.18));
      }

      outCtx.globalCompositeOperation = "source-over";
    }

    function titleLineText(artist, song) {
      if (!artist && !song) return "";
      if (!artist) return song;
      if (!song) return artist;
      return `${artist}   ${song}`;
    }

    function titleLineMetrics(bctx, line, size = fontSize) {
      if (!line) return null;
      bctx.letterSpacing = TITLE_LETTER_SPACING;
      bctx.font = fontOf(size);
      const metrics = muteTextMetrics(bctx, line, size, TITLE_LETTER_SPACING);
      const inset = hudPanelInsets(size);
      const blockW = inset.x * 2 + metrics.width;
      const blockH = metrics.height + inset.y * 2;
      return { line, metrics, inset, blockW, blockH };
    }

    function titleTextMetrics(bctx, artist, song, size = fontSize) {
      return titleLineMetrics(bctx, titleLineText(artist, song), size);
    }

    function titleBlockHeight(probe, size) {
      probe.letterSpacing = TITLE_LETTER_SPACING;
      probe.font = fontOf(size);
      let tallest = 0;
      for (const mix of broadcastMixes) {
        for (const track of mix.tracks) {
          const line = titleLineText(artistLineFor(track).toUpperCase(), track.song.toUpperCase());
          const { blockH } = titleLineMetrics(probe, line, size);
          tallest = Math.max(tallest, blockH);
        }
      }
      return tallest;
    }

    function widestTitleLine(probe, size) {
      probe.letterSpacing = TITLE_LETTER_SPACING;
      probe.font = fontOf(size);
      const inset = hudPanelInsets(size);
      let widest = 0;
      for (const mix of broadcastMixes) {
        for (const track of mix.tracks) {
          const line = titleLineText(artistLineFor(track).toUpperCase(), track.song.toUpperCase());
          const metrics = muteTextMetrics(probe, line, size, TITLE_LETTER_SPACING);
          widest = Math.max(widest, inset.x * 2 + metrics.width);
        }
      }
      return widest;
    }

    const MIN_FONT_PX = 40;
    const LAYOUT_CSS_W = 1100;
    const LAYOUT_TITLE_H = 260;
    const FIXED_FONT_PX = 40;
    const FIXED_HUD_FONT_PX = 40;

    function syncHudSafeArea() {
      document.body.style.paddingTop = "0";
      document.body.style.paddingBottom = "0";
    }

    function syncTitleVerticalPosition() {
      const titleEl = document.getElementById("title-wrap");
      const dockBar = document.getElementById("dock-bar-tv");
      if (!titleEl || !dockBar) return;
      const barTop = dockBar.getBoundingClientRect().top;
      const top = (barTop - LAYOUT_TITLE_H) / 2;
      titleEl.style.top = `${Math.max(0, Math.round(top))}px`;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fontSize = FIXED_FONT_PX;
      hudFontSize = FIXED_HUD_FONT_PX;

      canvas.width = Math.round(LAYOUT_CSS_W * dpr);
      canvas.height = Math.round(LAYOUT_TITLE_H * dpr);
      canvas.style.width = `${LAYOUT_CSS_W}px`;
      canvas.style.height = `${LAYOUT_TITLE_H}px`;
      for (const layer of Object.values(layers)) {
        layer.width = canvas.width;
        layer.height = canvas.height;
      }

      resizeMuteCanvas(dpr);
      resizeTimeCanvas(dpr);
      resizeDateCanvas(dpr);
      resizeSludgeCanvas(dpr);
      resizeScannerCanvas(dpr);
      resizeDockBarCanvas(dpr);
      layoutDockSlots();
      syncTitleVerticalPosition();
      if (nowPlayingTrackIndex >= 0 && nowPlayingMixIndex >= 0) {
        layoutTitleLinks(broadcastMixes[nowPlayingMixIndex].tracks[nowPlayingTrackIndex]);
      }
      syncHudSafeArea();
    }

    function paintTitleBlock(bctx, w, h, fillStyle, withGlow, midY) {
      if (!titleDisplayText) return;

      const block = titleLineMetrics(bctx, titleDisplayText);
      if (!block) return;
      let textX = (w - block.blockW) / 2 + block.inset.x;
      textX = Math.max(block.inset.x, Math.min(textX, w - block.blockW - block.inset.x));
      const blockTop = midY - block.blockH / 2;
      const textY = blockTop + block.inset.y + block.metrics.ascent;

      const track =
        nowPlayingMixIndex >= 0 && nowPlayingTrackIndex >= 0
          ? broadcastMixes[nowPlayingMixIndex].tracks[nowPlayingTrackIndex]
          : null;

      if (track) {
        drawHudHighlight(
          bctx,
          textX - block.inset.x,
          blockTop,
          block.blockW,
          block.blockH,
          titlePanel
        );
        drawTitleInkSegments(bctx, track, songText, textX, textY, fillStyle);
      } else {
        bctx.letterSpacing = TITLE_LETTER_SPACING;
        bctx.font = fontOf(fontSize);
        bctx.textAlign = "left";
        bctx.textBaseline = "alphabetic";
        drawLabeledLine(bctx, block.line, textX, textY, block.metrics, fontSize, fillStyle, titlePanel);
      }
    }

    function paintLayers(phase = "normal") {
      const w = canvas.width;
      const h = canvas.height;
      const shake =
        phase === "distort" ? (Math.random() - 0.5) * 12 : (Math.random() - 0.5) * 0.8;
      const midY = h * 0.5 + shake;

      for (const [name, layer] of Object.entries(layers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        if (phase === "hidden") continue;
        paintTitleBlock(bctx, w, h, titleColors[name], false, midY);
      }
    }

    function paintMuteLayers() {
      const w = muteCanvas.width;
      const h = muteCanvas.height;
      const cell = hudFontSize * 0.12;
      const inset = hudPanelInsets(hudFontSize);
      const ox = 1 + inset.x;
      const muteGlyphColors = audioMuted ? colors : hudGrayColors;
      for (const [name, layer] of Object.entries(muteLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        drawMuteMark(bctx, ox, h, cell, muteGlyphColors[name], muteLabelText, audioMuted);
      }
    }

    function frame() {
      const phase = titleGlitchPhase(performance.now());
      paintLayers(phase);
      if (phase === "hidden") {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      } else if (phase === "distort" || !screenGlitchSoft()) {
        renderGlitch(ctx, layers, canvas.width, canvas.height, false);
      } else {
        renderGlitch(ctx, layers, canvas.width, canvas.height, true);
      }
      requestAnimationFrame(frame);
    }

    function paintTimeLayers() {
      const w = timeCanvas.width;
      const h = timeCanvas.height;
      const rowH = dockRowCanvasHeight(muteLabelText, audioMuted);
      const probe = layers.white.getContext("2d");
      const minW = widestHudTextWidth(probe, timeCanvasSampleLabels());
      const box = hudTextBoxMetrics(rowH, datetimeTimeText, minW);

      for (const [name, layer] of Object.entries(timeLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        drawHudTextLine(bctx, box, datetimeTimeText, hudGrayColors[name]);
      }
    }

    function paintDateLayers() {
      const w = dateCanvas.width;
      const h = dateCanvas.height;
      const rowH = dockRowCanvasHeight(muteLabelText, audioMuted);
      const probe = layers.white.getContext("2d");
      const minW = widestHudTextWidth(probe, dateCanvasSampleLabels());
      const box = hudTextBoxMetrics(rowH, datetimeDateText, minW);

      for (const [name, layer] of Object.entries(dateLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        drawHudTextLine(bctx, box, datetimeDateText, hudGrayColors[name]);
      }
    }

    // function paintBrandLayers() {
    //   const w = brandCanvas.width;
    //   const h = brandCanvas.height;
    //   const dot = brandDotState(performance.now());
    //   const rowH = dockRowCanvasHeight(muteLabelText, audioMuted);
    //   const box = brandDotBoxMetrics(rowH);
    //
    //   for (const [name, layer] of Object.entries(brandLayers)) {
    //     const bctx = layer.getContext("2d");
    //     bctx.clearRect(0, 0, w, h);
    //     drawBrandDotMark(bctx, w, h, hudGrayColors[name], dot.visible, dot.scale, box);
    //   }
    // }

    function muteFrame() {
      paintMuteLayers();
      renderGlitch(muteCtx, muteLayers, muteCanvas.width, muteCanvas.height, screenGlitchSoft());
      requestAnimationFrame(muteFrame);
    }

    function datetimeFrame() {
      syncDatetimeClock();
      paintTimeLayers();
      paintDateLayers();
      renderGlitch(timeCtx, timeLayers, timeCanvas.width, timeCanvas.height, screenGlitchSoft());
      renderGlitch(dateCtx, dateLayers, dateCanvas.width, dateCanvas.height, screenGlitchSoft());
      requestAnimationFrame(datetimeFrame);
    }

    function paintSludgeLayers() {
      const w = sludgeCanvas.width;
      const h = sludgeCanvas.height;
      const rowH = dockRowCanvasHeight(muteLabelText, audioMuted);
      const box = sludgeBoxMetrics(rowH);
      const textX = box.margin + box.inset.x;
      const rowY = h / 2;

      for (const [name, layer] of Object.entries(sludgeLayers)) {
        const bctx = layer.getContext("2d");
        bctx.clearRect(0, 0, w, h);
        bctx.letterSpacing = HUD_LETTER_SPACING;
        bctx.font = fontOf(hudFontSize);
        bctx.textAlign = "left";
        bctx.textBaseline = "alphabetic";
        drawLabeledLine(
          bctx,
          SLUDGE_LABEL,
          textX,
          box.metrics.baselineForMid(rowY),
          box.metrics,
          hudFontSize,
          hudGrayColors[name],
          hudPanel,
          false
        );
      }
    }

    // function brandFrame() {
    //   paintBrandLayers();
    //   renderGlitch(brandCtx, brandLayers, brandCanvas.width, brandCanvas.height, screenGlitchSoft());
    //   requestAnimationFrame(brandFrame);
    // }

    function sludgeFrame() {
      paintSludgeLayers();
      renderGlitch(sludgeCtx, sludgeLayers, sludgeCanvas.width, sludgeCanvas.height, screenGlitchSoft());
      requestAnimationFrame(sludgeFrame);
    }

    const muteButton = document.getElementById("mute");
    const muteLabel = document.getElementById("mute-label");

    function syncMuteUi() {
      muteLabelText = audioMuted ? "Unmute" : "Mute";
      muteLabel.textContent = muteLabelText;
      muteButton.setAttribute("aria-pressed", String(!audioMuted));
      muteButton.setAttribute("aria-label", audioMuted ? "Unmute audio" : "Mute audio");
      syncBroadcastMuteState();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      resizeMuteCanvas(dpr);
      resizeTimeCanvas(dpr);
      resizeDateCanvas(dpr);
      resizeSludgeCanvas(dpr);
      resizeScannerCanvas(dpr);
      resizeDockBarCanvas(dpr);
      if (dockLayoutFrozen) {
        layoutDockSlots(true);
      }
    }

    muteButton.addEventListener("click", () => {
      audioMuted = !audioMuted;

      if (!audioMuted) {
        playbackUnlocked = true;
        syncBroadcastMuteState();
        syncAudioToBroadcast(true);
        const active = activeAudioEl();
        const playPromise = active.play();
        initRadioAudioAnalyser();
        syncMuteUi();
        void (async () => {
          try {
            if (playPromise) await playPromise;
            await resumeRadioAudioContext();
            attachRadioAnalyserTaps();
            syncNowPlayingFromAudio();
          } catch (err) {
            radioLog("warn", "unmute_play_rejected", { message: String(err) });
            await tryStartMutedPlayback();
          }
        })();
      } else {
        syncMuteUi();
        syncBroadcastMuteState();
      }
    });

    syncMuteUi();

    window.addEventListener("resize", () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      resizeBgCanvas();
      resizeScannerCanvas(dpr);
      resizeDockBarCanvas(dpr);
      syncTitleVerticalPosition();
      if (nowPlayingTrackIndex >= 0 && nowPlayingMixIndex >= 0) {
        layoutTitleLinks(broadcastMixes[nowPlayingMixIndex].tracks[nowPlayingTrackIndex]);
      }
    });

    async function startTitle() {
      await document.fonts.load(`400 40px ${titleFont}`);
      await document.fonts.ready;
      datetimeTimeText = vcrTimeLabel();
      datetimeDateText = vcrDateLabel();
      const now = new Date();
      datetimeLastTick = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      resize();
      resizeBgCanvas();
      initRadioAudio();
      requestAnimationFrame(screenGlitchLoop);
      requestAnimationFrame(bgFrame);
      requestAnimationFrame(frame);
      requestAnimationFrame(dockBarFrame);
      requestAnimationFrame(muteFrame);
      requestAnimationFrame(datetimeFrame);
      requestAnimationFrame(sludgeFrame);
      requestAnimationFrame(scannerFrame);
    }

    startTitle();
  </script>
